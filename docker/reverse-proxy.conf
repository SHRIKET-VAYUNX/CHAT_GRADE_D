# TLS termination for VAYUNX (Grade D — Broken / Insecure / Deprecated).
#
# SSLv3 only, per the Grade D grading-inventory transport profile. This config
# is served by the custom reverse-proxy image (docker/reverse-proxy.Dockerfile)
# which builds nginx 1.22 against OpenSSL 1.0.2u with SSLv3 + RC4 re-enabled.
# With that image the SSLv3 + RC4-MD5 handshake ACTUALLY negotiates (verified:
# `Protocol: SSLv3 / Cipher: RC4-MD5`, full HTTP round-trip). A stock
# `nginx:*-alpine` (OpenSSL 3.x) cannot — RC4/3DES are compiled out of the
# default provider, so it dies at config load with "no cipher match" and never
# negotiates SSLv3. See DECISIONS.md.
#
# SSLv3 has been deprecated and insecure since ~2014 (POODLE). Modern browsers
# (Edge/Chrome/Firefox) removed SSLv3 from their TLS stack entirely, so they
# CANNOT complete this handshake regardless of the server — that is the
# expected Grade D outcome, not a server bug. Verify with an era-appropriate
# client: `openssl s_client -ssl3 -cipher RC4-MD5` (OpenSSL 1.0.2).
#
# The cipher list is deliberately RC4 + 3DES (no @SECLEVEL qualifier — that is
# an OpenSSL 1.1.0+ syntax and is an "invalid command" on 1.0.2u; weak ciphers
# are allowed by default there). The dev cert is an EXPIRED self-signed cert
# (notAfter in the past), and the proxy requests no client certificates (so it
# validates nothing — there is no nginx `ssl_verify` directive; the previous
# config's `ssl_verify off;` was bogus and nginx rejected it). HSTS is
# intentionally NOT set. HTTP/2 is NOT enabled — it requires TLS 1.2+ ALPN,
# which is impossible under an SSLv3-only listener.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Grade D: SSLv3 only. Now that the reverse-proxy image is built on
        # OpenSSL 1.0.2u, SSLv3 actually negotiates — the TLS 1.0 fallback
        # that was only there to keep OpenSSL-3.x builds alive is no longer
        # needed and is removed so the transport is genuinely SSLv3.
        ssl_protocols SSLv3;

        # Deliberately weak/broken cipher suites (RC4-MD5, 3DES) — the Grade D
        # intent is the legacy suites at the front; RC4-MD5 is the inventory's
        # transport cipher.
        ssl_ciphers "RC4-MD5:RC4-SHA:DES-CBC3-SHA:DES-CBC-SHA";

        # Certificate validation disabled for Grade D: the dev cert is an
        # EXPIRED self-signed one, and the proxy does not request client
        # certificates (no `ssl_verify_client on`), so it validates nothing —
        # the broken "validation disabled" posture is the default, not a
        # directive. (There is no nginx `ssl_verify` directive; a previous
        # version had a bogus `ssl_verify off;` that nginx rejects.)

        # HSTS intentionally disabled for Grade D (Broken/Insecure/Deprecated
        # profile) — no Strict-Transport-Security header. See DECISIONS.md.

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}