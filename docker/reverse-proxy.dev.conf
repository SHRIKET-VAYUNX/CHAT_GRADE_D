# Dev SSLv3 reverse proxy for fronting NATIVE processes (uvicorn :8001 + vite
# :5174, both plain http) over the Grade D SSLv3 transport.
#
# NOT used by `python backend/run.py` anymore — run.py now brings up the full
# containerized stack (reverse-proxy.conf / the `reverse-proxy` service) so the
# app's internal http ports are never published to the host and there is no
# plain-http backdoor. This conf is kept only for manual native-dev fronting
# (vite hot-reload, etc.); it shares port 8443 with the full-stack
# `reverse-proxy` service, so the two are mutually exclusive.
#
# A MODERN browser (Chrome / Edge / Firefox / Brave) CANNOT open
# https://localhost:8443: they removed SSLv3 from their TLS stack entirely
# post-POODLE, so the handshake fails. That failure IS the visible Grade D
# transport proof. An era-appropriate client (Pale Moon, or
# `openssl s_client -ssl3 -cipher RC4-MD5`) DOES complete the handshake and
# loads the app through here.
#
# This is the dev counterpart of reverse-proxy.conf, which fronts the
# CONTAINERIZED backend/frontend in the full Docker stack (`docker compose up`).
# The only difference is the upstreams: here they point at host.docker.internal
# (the Docker Desktop host gateway) so the container reaches run.py's native
# processes. The broken transport posture is identical: SSLv3 only, RC4/3DES
# ciphers, expired self-signed cert, no HSTS, no @SECLEVEL (1.0.2u allows weak
# ciphers by default). See DECISIONS.md.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # host.docker.internal resolves to the Docker Desktop host, so the container
    # reaches run.py's native uvicorn (:8001) and vite (:5174). (Requires
    # `extra_hosts: host.docker.internal:host-gateway` in docker-compose.yml.)
    upstream backend_upstream {
        server host.docker.internal:8001;
    }

    upstream frontend_upstream {
        server host.docker.internal:5174;
    }

    server {
        listen 443 ssl;

        # The same EXPIRED self-signed dev cert run.py serves (RSA-2048, SAN
        # localhost/127.0.0.1). Chrome fails at the SSLv3 handshake before any
        # cert validation, so the cert's validity is moot for the proof; Pale
        # Moon loads it with cert validation disabled (Grade D client posture).
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Grade D: SSLv3 only — genuinely negotiates on the OpenSSL 1.0.2u image.
        ssl_protocols SSLv3;
        ssl_ciphers "RC4-MD5:RC4-SHA:DES-CBC3-SHA:DES-CBC-SHA";

        # No HSTS, no client-cert verification (proxy requests no client certs),
        # no HTTP/2 (needs TLS 1.2+ ALPN, impossible under SSLv3) — same as the
        # full-stack reverse-proxy.conf.

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}